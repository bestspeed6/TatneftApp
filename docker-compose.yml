services:
  db:
    image: postgres:16-alpine
    container_name: staffdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: staffdb
      POSTGRES_USER: staffuser
      POSTGRES_PASSWORD: staffpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffuser -d staffdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./StaffManagementApp
      dockerfile: Dockerfile
    container_name: staffapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=staffdb;Username=staffuser;Password=staffpass
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - avatars_data:/app/wwwroot/uploads/avatars
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  avatars_data:
  dataprotection_keys:
